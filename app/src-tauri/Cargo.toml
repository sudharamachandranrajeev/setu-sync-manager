[package]
name = "setu-app"
description = "Choose what syncs between two computers, and which way"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "setu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
setu-core = { path = "../../core" }
setu-engine = { path = "../../engine" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
notify-rust = "4.18"
# In-app updates: GitHub releases over HTTPS, versions, and the download's signature.
ureq = { version = "3.5", features = ["json"] }
semver = "1"
minisign-verify = "0.2"
base64 = "0.22"
tempfile = "3.27"

[target.'cfg(windows)'.dependencies]
# Already used by notify-rust on Windows; used directly for the toast's progress bar.
tauri-winrt-notification = "0.8"
