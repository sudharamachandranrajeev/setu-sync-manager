# A v* tag builds the Linux download and the Windows installer and publishes a GitHub
# release (a pre-release for v0.* and tags with a suffix such as -alpha.1). Running it by
# hand (Actions, "Release", Run workflow) only builds.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - run: npm ci
        working-directory: app
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [[ $GITHUB_REF == refs/tags/v* ]] && version=${GITHUB_REF#refs/tags/v}
          packaging/linux/package.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/package/*.tar.gz*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          cargo build --release --locked -p setu-cli
          cd app
          npm ci
          npx tauri build --no-bundle
      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF.Substring(11) }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /Qp /DAppVersion=$version packaging\windows\setu.iss
          Get-ChildItem target\package\*.exe | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name | Out-File -Encoding ascii "$($_.FullName).sha256" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/package/*.exe*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          pre=""
          [[ $tag == v0.* || $tag == *-* ]] && pre="--prerelease"
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --title "Setu $tag" $pre --notes "Linux: unpack the .tar.gz and run ./install.sh. Windows: run the setup .exe. Neither is code-signed yet, so Windows SmartScreen warns the first time (More info, Run anyway). Check a download with its .sha256 file."
