# Checks every push and pull request on Linux and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The sync engine (engine/go) is Go built with cgo.
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go/go.mod
          cache-dependency-path: engine/go/go.sum
      - name: Engine C compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/llvm-mingw.ps1
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: Window
        working-directory: app
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          npm run build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Two engines, end to end
        run: cargo test -p setu-engine --test two_engines --locked -- --ignored
