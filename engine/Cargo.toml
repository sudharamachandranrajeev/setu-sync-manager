[package]
name = "setu-engine"
description = "Syncthing's code built into Setu: start, stop and direct calls, no REST API"
version.workspace = true
edition.workspace = true
# The Rust wrapper is MIT like Setu; the Go code in go/ is MPL-2.0 like Syncthing.
license = "MIT AND MPL-2.0"
build = "build.rs"
links = "setuengine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The end-to-end tests drive Setu's own code against two engines.
brahma-sync = { git = "https://github.com/sudharamachandranrajeev/brahma-life-suite", branch = "feat/rust-sync-client" }
setu-core = { path = "../core" }
tempfile = "3"
